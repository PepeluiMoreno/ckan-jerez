name: Deploy ckan-jerez

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/pepeluimoreno/ckan-jerez

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ckan-jerez
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      # El secreto multilinea se materializa AQUI (el runner preserva los saltos
      # de linea) y viaja por SCP. Pasarlo como env de la accion SSH aplastaba
      # los \n y una variable se tragaba la asignacion de la siguiente.
      - name: Materializar .env.production
        env:
          CONTENT: ${{ secrets.CKANJEREZ_ENV_PRODUCTION }}
        run: |
          printf '%s\n' "$CONTENT" > .env.production
          # legible para el contenedor de la accion SCP (el runner es efimero;
          # el endurecimiento real es el chmod en el host tras copiar)
          chmod 644 .env.production
          n=$(grep -cE '^[A-Z_]+=' .env.production || true)
          echo "variables detectadas: $n"
          if [ "$n" -lt 4 ]; then echo "::error::.env.production sospechosamente corto"; exit 1; fi

      - name: Copiar .env.production al host (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: ".env.production"
          target: "/opt/docker/apps/ckan-jerez/"

      - name: Deploy to server (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            APP_DIR=/opt/docker/apps/ckan-jerez
            if [ ! -d "$APP_DIR/.git" ]; then
              if ! ( mkdir -p "$APP_DIR" 2>/dev/null && [ -w "$APP_DIR" ] ); then
                APP_DIR="$HOME/ckan-jerez"
                echo "[bootstrap] /opt/docker/apps no escribible; uso $APP_DIR"
                mkdir -p "$APP_DIR"
              fi
              echo "[bootstrap] primer despliegue: clonando el repo en $APP_DIR"
              git clone https://github.com/PepeluiMoreno/ckan-jerez.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git pull --ff-only
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            chmod 600 .env.production || true
            COMPOSE="docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml"
            # Stack CKAN opcional: se incluye SOLO si sus variables están definidas en
            # .env.production. Así el merge a master no rompe el deploy: hasta que pongas
            # las variables se despliega solo la app; en cuanto estén, el stack arranca.
            CKAN_STACK=0
            if grep -qE '^CKAN_DB_PASSWORD=.+' .env.production 2>/dev/null \
               && grep -qE '^CKAN_SESSION_SECRET=.+' .env.production 2>/dev/null; then
              COMPOSE="$COMPOSE -f docker-compose.ckan.yml"
              CKAN_STACK=1
              echo "[ckan] variables presentes: el stack CKAN (ckan.pepelui.es) se desplegará."
            else
              echo "[ckan] variables CKAN ausentes: se despliega solo la app (sin stack CKAN)."
            fi
            $COMPOSE pull --ignore-buildable 2>/dev/null || true
            # Arranca/actualiza el servicio web (uvicorn): sirve panel /, API /api,
            # webhook /webhooks/odmgr y /health. (Antes solo corría un smoke de worker
            # y NUNCA se levantaba el servidor -> Traefik 503 sin backend.)
            $COMPOSE up -d ckan-jerez
            echo "[health] esperando a que ckan-jerez responda /health..."
            ok=0
            for i in $(seq 1 30); do
              if $COMPOSE exec -T ckan-jerez curl -fsS -m 5 http://localhost:8000/health >/dev/null 2>&1; then ok=1; break; fi
              sleep 3
            done
            if [ "$ok" != 1 ]; then
              echo "[health] FALLO: /health no responde. Últimos logs:"
              $COMPOSE logs --tail=60 ckan-jerez || true
              exit 1
            fi
            echo "[health] OK — ckan-jerez sirviendo"
            if [ "$CKAN_STACK" = 1 ]; then
              echo "[ckan] levantando el stack CKAN (build de la imagen + servicios)…"
              $COMPOSE up -d --build ckan-db ckan-solr ckan-redis ckan
              echo "[ckan] stack lanzado. CKAN se autoinicializa (bootstrap) y tarda ~1-2 min en responder en ckan.pepelui.es."
              echo "=== DIAGNÓSTICO CKAN (estado + logs) ==========================="
              sleep 45
              echo "--- docker ps (stack ckan) ---"
              docker ps -a --filter "name=${APP_PREFIX:-ckanjerez}_ckan" --format '{{.Names}}  {{.Status}}' || true
              echo "--- logs ckan (tail 150) ---"
              docker logs "${APP_PREFIX:-ckanjerez}_ckan" --tail 150 2>&1 || true
              echo "--- logs solr (tail 20) ---"
              docker logs "${APP_PREFIX:-ckanjerez}_ckan_solr" --tail 20 2>&1 || true
              echo "=== FIN DIAGNÓSTICO CKAN ========================================"
            fi
            docker image prune -f
