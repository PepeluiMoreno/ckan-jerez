name: Deploy ckan-jerez

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/pepeluimoreno/ckan-jerez

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ckan-jerez
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      CKANJEREZ_ENV_PRODUCTION: ${{ secrets.CKANJEREZ_ENV_PRODUCTION }}

    steps:
      - name: Deploy to server (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: CKANJEREZ_ENV_PRODUCTION
          script: |
            cd /opt/docker/apps/ckan-jerez
            git pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            umask 077
            printf '%s\n' "$CKANJEREZ_ENV_PRODUCTION" > .env.production
            COMPOSE="docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml"
            $COMPOSE pull
            # ckan-jerez es un worker subscriptor: no hay servicio web que sondear.
            # El "health" es el smoke — que ODM responde por su API (sin tocar su BD).
            echo "[smoke] verificando suscripción a ODM vía API..."
            if ! $COMPOSE run --rm ckan-jerez smoke; then
              echo "[smoke] FALLO: ODM no responde por su API. Workflow en ROJO."
              exit 1
            fi
            docker image prune -f
