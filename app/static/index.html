<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ckan-jerez — Consola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { mono: ['JetBrains Mono','Monaco','monospace'] } } } }</script>
  <style>
    body { background:#111827; color:#d1d5db; }
    .nav-item { display:flex; align-items:center; gap:.625rem; padding:.625rem .75rem; border-radius:.5rem; font-size:.875rem; color:#d1d5db; cursor:pointer; transition:background .15s,color .15s; }
    .nav-item:hover { background:#374151; color:#fff; }
    .nav-item.active { background:#374151; color:#fff; font-weight:500; }
    .card { background:#1f2937; border:1px solid #374151; border-radius:.75rem; }
    .btn { font-size:.8rem; border-radius:.5rem; padding:.45rem .85rem; transition:background .15s; }
    .btn-primary { background:#2563eb; color:#fff; } .btn-primary:hover { background:#3b82f6; }
    .btn-ghost { background:rgba(55,65,81,.5); color:#cbd5e1; } .btn-ghost:hover { background:#374151; color:#fff; }
    .btn-danger { background:#dc2626; color:#fff; } .btn-danger:hover { background:#ef4444; }
    th { text-align:left; font-weight:600; color:#9ca3af; }
    td,th { padding:.5rem .65rem; border-bottom:1px solid #374151; font-size:.8rem; vertical-align:top; }
    pre { background:#0b1220; border:1px solid #374151; border-radius:.5rem; padding:.75rem; overflow:auto; font-size:.75rem; color:#cbd5e1; }
    .pill { font-size:.7rem; padding:.1rem .5rem; border-radius:9999px; font-weight:500; white-space:nowrap; }
    .stline { display:flex; align-items:center; justify-content:space-between; font-size:.72rem; color:#6b7280; }
    input, select { outline:none; }
  </style>
</head>
<body class="font-mono">
<div id="app" class="flex h-screen overflow-hidden"></div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
const { createApp, ref, reactive, onMounted, computed } = Vue

createApp({
  setup() {
    const view = ref('recursos')
    const nav = [
      { id:'recursos', label:'🗂️ Recursos' },
      { id:'actividad', label:'📨 Recepciones' },
    ]
    const err = ref('')
    const busy = ref(false)
    const appVersion = ref('')
    const ram = reactive({ total:0, avail:0 })
    const status = reactive({ ckan_configured:false, odm:'checking', application:null, application_name:null, webhook_url:null, config_missing:[], sync:{} })

    const catalog = reactive({ publishers:{}, sources:[], subscribe_publishers:[] })
    const resources = ref([])
    const subscriptions = ref([])
    const executions = ref([])
    const notifications = ref([])
    const fetchers = ref([])
    const odmPubs = ref([])

    const filtros = reactive({ q:'', pub:'', soloSus:true })
    const filtrosRec = reactive({ desde:'', hasta:'', dataset:'', estado:'', pub:'' })
    const publishersRec = computed(() => [...new Set((notifications.value||[]).map(n=>n.publisher).filter(Boolean))].sort())
    const recepcionesFiltradas = computed(() => {
      const desde = filtrosRec.desde ? new Date(filtrosRec.desde+'T00:00:00') : null
      const hasta = filtrosRec.hasta ? new Date(filtrosRec.hasta+'T23:59:59') : null
      const ds = (filtrosRec.dataset||'').toLowerCase()
      return (notifications.value||[]).filter(n => {
        const t = n.sentAt ? new Date(n.sentAt.replace(' ','T')+(/[zZ+]/.test(n.sentAt)?'':'Z')) : null
        if (desde && (!t || t < desde)) return false
        if (hasta && (!t || t > hasta)) return false
        if (ds && !String(n.datasetName||n.datasetId||'').toLowerCase().includes(ds)) return false
        if (filtrosRec.pub && n.publisher !== filtrosRec.pub) return false
        const ok = n.statusCode>=200 && n.statusCode<300
        if (filtrosRec.estado==='ok' && !ok) return false
        if (filtrosRec.estado==='error' && ok) return false
        return true
      })
    })
    const modal = reactive({ open:false, titulo:'', texto:'' })
    const help = ref(false)
    const onboarding = reactive({ tiene_token:false, operativa:false, solicitud:null, app_username:null, token_origen:null, token_error:null, app_name:'ckan-jerez', eventos:[] })
    const altaForm = reactive({ nombre:'ckan-jerez', contacto:'', proposito:'Homogeneización y publicación en CKAN de datos abiertos de Jerez.', descripcion:'', persona_contacto:'', email:'', telefono:'', github_url:'' })
    const tokenInput = ref('')
    const proposeForm = reactive({ name:'Jerez — ', root_url:'', variante:'Censo documental', descripcion:'' })
    const proposeDone = ref(null)
    const delRecurso = reactive({ open:false, rid:null, nombre:'', hard:false })
    const solicitudPendiente = computed(() => !!onboarding.solicitud && !onboarding.operativa && (onboarding.solicitud.estado || 'pendiente') !== 'rechazada')
    const altaCerrada = ref(false)
    const altaCompleta = computed(() => ['nombre','descripcion','persona_contacto','email','github_url'].every(k => (altaForm[k]||'').trim()))
    const showWizard = ref(false)
    const wizard = reactive({
      fetcher:'', preset:'', template:null, fixed:[], manifest:null, done:null,
      form: { pub:'', publisher:{acronimo:'',nombre:'',nivel:'MUNICIPAL',pais:'España',portal_url:''},
              name:'', schedule:'', params:[] },
    })

    // ── infra ──
    async function api(path, opts) {
      const r = await fetch('/api'+path, opts)
      if (!r.ok) { let d; try{ d=await r.json() }catch{}; throw new Error(d?.detail || (r.status+' '+r.statusText)) }
      return r.json()
    }
    async function run(fn) { err.value=''; busy.value=true; try { await fn() } catch(e){ err.value=String(e.message||e) } finally { busy.value=false } }
    async function loadStatus() {
      try { Object.assign(status, await api('/status')) } catch { status.odm='offline' }
      try { const d = await api('/system/info'); ram.total=d.ram_total_mb; ram.avail=d.ram_available_mb } catch {}
    }

    // ── derivados ──
    const subByResource = computed(() => { const m={}; for (const s of subscriptions.value) m[s.resourceId]=s; return m })
    const lastOk = computed(() => {
      const m = {}
      for (const e of executions.value)
        if (e.status==='completed' && e.completedAt && (!m[e.resourceId] || e.completedAt > m[e.resourceId])) m[e.resourceId]=e.completedAt
      return m
    })
    const pubsDisponibles = computed(() => [...new Set(resources.value.map(r=>r.publisher).filter(Boolean))].sort())
    const nombresEnOdm = computed(() => new Set(resources.value.map(r => (r.name||'').trim().toLowerCase())))
    const pendientes = computed(() => (catalog.sources||[]).filter(s => !nombresEnOdm.value.has((s.name||'').trim().toLowerCase())))
    const recursosFiltrados = computed(() => resources.value.filter(r =>
      (!filtros.q || (r.name||'').toLowerCase().includes(filtros.q.toLowerCase()) || (r.publisher||'').toLowerCase().includes(filtros.q.toLowerCase())) &&
      (!filtros.pub || r.publisher === filtros.pub) &&
      (!filtros.soloSus || subByResource.value[r.id])))
    // ── Jerarquía nodriza → recursos descubiertos (explorador de suscripción) ──
    const esNodriza = (r) => r && r.generaColecciones === true
    const expandidas = ref(new Set())
    const toggleNodriza = (id) => { const n = new Set(expandidas.value); n.has(id) ? n.delete(id) : n.add(id); expandidas.value = n }
    const hijosDe = (id) => resources.value.filter(r => r.parentResourceId === id).sort((a,b)=>(a.name||'').localeCompare(b.name||'','es'))
    const idsPresentes = computed(() => new Set(resources.value.map(r => r.id)))
    const topNivel = computed(() => recursosFiltrados.value.filter(r => !r.parentResourceId || !idsPresentes.value.has(r.parentResourceId)))
    const pubsOdmExtra = computed(() => {
      const conocidos = new Set()
      for (const [k,v] of Object.entries(catalog.publishers||{})) { conocidos.add(k); if (v.nombre) conocidos.add(v.nombre) }
      return odmPubs.value.filter(p => !conocidos.has(p.acronimo) && !conocidos.has(p.nombre))
    })
    const ramPct = computed(() => ram.total ? Math.round((1 - ram.avail/ram.total)*100) : 0)
    const ramColor = computed(() => { const f=100-ramPct.value; return f<15?'#f87171':f<30?'#fbbf24':'#34d399' })
    const presetsOf = computed(() => (fetchers.value.find(f=>f.name===wizard.fetcher)?.presets)||[])
    const syncLabel = computed(() => {
      const s = status.sync||{}
      if (s.last_ok) return '✓ ' + fmtAgo(s.last_ok.replace(/\.\d+/,'').replace('+00:00',''))
      if ((status.config_missing||[]).length) return 'falta config'
      if (s.last_error) return 'reintentando'
      return '…'
    })
    function fmtAgo(iso) {
      if (!iso) return '—'
      const t = new Date(iso.endsWith('Z')||iso.includes('+') ? iso : iso+'Z').getTime()
      const mins = Math.floor((Date.now()-t)/60000)
      if (isNaN(mins)) return iso
      if (mins < 1) return 'ahora'
      if (mins < 60) return `hace ${mins} min`
      if (mins < 1440) return `hace ${Math.floor(mins/60)} h`
      return `hace ${Math.floor(mins/1440)} d`
    }
    function minsDesde(iso) { if (!iso) return null; const t=new Date(iso.endsWith('Z')?iso:iso+'Z').getTime(); return Math.floor((Date.now()-t)/60000) }
    function enOdm(name) { return nombresEnOdm.value.has((name||'').trim().toLowerCase()) }

    // ── cargas ──
    async function loadRecursos() {
      const c = await api('/catalog'); Object.assign(catalog, c)
      resources.value = await api('/odm/resources')
      try { subscriptions.value = await api('/odm/subscriptions') } catch {}
      try { executions.value = await api('/odm/executions') } catch {}
      try { odmPubs.value = await api('/odm/publishers') } catch {}
      try { fetchers.value = await api('/odm/fetchers') } catch {}
    }
    async function loadActividad() {
      try { notifications.value = await api('/odm/notifications') } catch {}
    }
    async function loadOnboarding() { Object.assign(onboarding, await api('/onboarding')) }
    function enviarSolicitud() { run(async () => {
      onboarding.solicitud = await api('/onboarding/solicitar', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(altaForm)})
    }) }
    function guardarToken() { run(async () => {
      await api('/onboarding/token', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tokenInput.value})})
      tokenInput.value=''; await loadOnboarding(); await loadStatus()
    }) }
    function proponerRecurso() { run(async () => {
      proposeDone.value=null
      proposeDone.value = await api('/odm/propose', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(proposeForm)})
    }) }
    const loaders = { recursos: loadRecursos, actividad: loadActividad }
    function go(id) { view.value = id; if (loaders[id]) run(loaders[id]) }

    // ── acciones ──
    function suscribir(rid) { run(async () => {
      await api('/odm/subscribe', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource_id:rid})})
      subscriptions.value = await api('/odm/subscriptions')
    }) }
    function desuscribir(rid) {
      const sub = subByResource.value[rid]; if (!sub) return
      run(async () => {
        await api('/odm/unsubscribe', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription_id:sub.id})})
        subscriptions.value = await api('/odm/subscriptions')
      })
    }
    function refrescar(rid) {
      const m = minsDesde(lastOk.value[rid])
      if (m !== null && m < 60) {
        modal.open=true; modal.titulo='Refresco rechazado'
        modal.texto=`Este recurso se ejecutó con éxito hace ${m} min. Se admite un refresco por hora para no abusar del proveedor.`
        return
      }
      run(async () => {
        const out = await api('/odm/execute', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource_id:rid})})
        if (out && out.success === false) { modal.open=true; modal.titulo='ODM rechazó el refresco'; modal.texto=out.message||'Rechazado.' }
        await loadRecursos()
      })
    }
    function borrarRecurso(rid, nombre) {
      delRecurso.rid = rid; delRecurso.nombre = nombre; delRecurso.hard = false; delRecurso.open = true
    }
    function confirmarBorrado() {
      const { rid, hard } = delRecurso
      delRecurso.open = false
      run(async () => {
        await api('/odm/resource/delete', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resource_id:rid, hard})})
        await loadRecursos()
      })
    }
    function clonar(rid) { run(async () => {
      const m = await api('/odm/resource/manifest?resource_id=' + encodeURIComponent(rid))
      const r = (m.resources||[])[0] || {}; const pub = m.publisher || {}
      wizard.fetcher = r.fetcher || ''; wizard.preset = r.preset || ''
      wizard.template = { resources:[r] }; wizard.fixed = []; wizard.manifest=null; wizard.done=null
      wizard.form.pub = ''
      wizard.form.publisher = { acronimo: pub.acronimo||'', nombre: pub.nombre||'', nivel: pub.nivel||'MUNICIPAL', pais: pub.pais||'España', portal_url: pub.portal_url||'' }
      wizard.form.name = (r.name||'') + ' (copia)'
      wizard.form.schedule = (typeof r.schedule==='string' && !r.schedule.startsWith('<')) ? r.schedule : ''
      wizard.form.params = (r.params||[]).map(p => ({key:p.key, value:p.value}))
      showWizard.value = true
      setTimeout(() => window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'}), 50)
    }) }

    // ── asistente ──
    function getTemplate() { run(async () => {
      wizard.manifest=null; wizard.done=null
      const t = await api('/odm/manifest-template', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fetcherCode:wizard.fetcher, presetCode:wizard.preset||null})})
      wizard.template = t
      wizard.fixed = (t._plantilla && t._plantilla.params_fijados_por_preset) || []
      const tparams = ((t.resources||[])[0]||{}).params || []
      wizard.form.params = tparams.map(p => ({key:p.key, value:p.value}))
      if (!wizard.form.params.some(p=>p.key==='root_url')) wizard.form.params.push({key:'root_url', value:''})
    }) }
    function pickPub() {
      const k = wizard.form.pub
      if (k && catalog.publishers[k]) wizard.form.publisher = {acronimo:k, ...catalog.publishers[k]}
      else if (k && k.startsWith('odm:')) {
        const p = odmPubs.value.find(x => x.id === k.slice(4)) || {}
        wizard.form.publisher = {acronimo: p.acronimo||p.nombre||'', nombre: p.nombre||'', nivel: p.nivel||'MUNICIPAL'}
      }
      else wizard.form.publisher = {acronimo:'',nombre:'',nivel:'MUNICIPAL',pais:'España',portal_url:''}
    }
    function addParam() { wizard.form.params.push({key:'', value:''}) }
    function delParam(i) { wizard.form.params.splice(i,1) }
    function _payload(dry) {
      const params = {}; wizard.form.params.forEach(p => { if (p.key) params[p.key]=p.value })
      return JSON.stringify({fetcher_code:wizard.fetcher, preset_code:wizard.preset||null,
        publisher:wizard.form.publisher, name:wizard.form.name, schedule:wizard.form.schedule, params, dry_run:dry})
    }
    function previewSource() { run(async () => {
      const out = await api('/sources/new', {method:'POST',headers:{'Content-Type':'application/json'},body:_payload(true)})
      wizard.manifest = out.manifest; wizard.done=null
    }) }
    function createSource() { run(async () => {
      const out = await api('/sources/new', {method:'POST',headers:{'Content-Type':'application/json'},body:_payload(false)})
      wizard.done = out.result; wizard.manifest = out.manifest
      await loadRecursos()
    }) }

    onMounted(() => {
      loadStatus(); run(loadOnboarding); run(loadRecursos)
      api('/version').then(d=>appVersion.value=d.version).catch(()=>{})
      setInterval(loadStatus, 15000)
      // Mientras no esté operativa, comprobar el alta sola y cerrar la ventana al aprobarse.
      setInterval(() => { if (!onboarding.operativa) loadOnboarding() }, 5000)
    })

    return { view, nav, err, busy, appVersion, ram, ramPct, ramColor, status, syncLabel,
             catalog, resources, subscriptions, executions, notifications, fetchers, odmPubs,
             filtros, modal, showWizard, wizard, presetsOf, pubsDisponibles, pubsOdmExtra,
             subByResource, lastOk, pendientes, recursosFiltrados,
             esNodriza, expandidas, toggleNodriza, hijosDe, topNivel,
             go, fmtAgo, enOdm, suscribir, desuscribir, refrescar, borrarRecurso, confirmarBorrado, delRecurso, clonar,
             help, onboarding, altaForm, altaCerrada, altaCompleta, tokenInput, proposeForm, proposeDone, solicitudPendiente,
             filtrosRec, recepcionesFiltradas, publishersRec,
             enviarSolicitud, guardarToken, proponerRecurso, loadOnboarding,
             getTemplate, pickPub, addParam, delParam, previewSource, createSource }
  },
  template: `
  <!-- Sidebar -->
  <div class="w-64 h-full bg-gray-800 border-r border-gray-700 flex flex-col flex-shrink-0">
    <div class="p-5 border-b border-gray-700">
      <h1 class="text-lg font-bold text-blue-400 leading-tight">ckan-jerez</h1>
      <p class="text-xs text-gray-400 mt-0.5">Suscriptor de OpenDataManager</p>
    </div>
    <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto">
      <div v-for="n in nav" :key="n.id" class="nav-item" :class="{active: view===n.id}" @click="go(n.id)">{{ n.label }}</div>
      <div class="nav-item" @click="help=true">❓ Ayuda</div>
    </nav>
    <div class="p-4 border-t border-gray-700 space-y-2">
      <div class="stline"><span>ODM</span>
        <span :style="{color: status.odm==='online'?'#34d399':'#f87171'}">● {{ status.odm }}</span></div>
      <div class="stline"><span>CKAN</span>
        <span :style="{color: status.ckan_configured?'#34d399':'#6b7280'}">{{ status.ckan_configured ? 'configurado' : 'sin configurar' }}</span></div>
      <div class="stline"><span>Registro en ODM</span>
        <span v-if="status.application" style="color:#34d399" :title="'webhook: '+(status.webhook_url||'—')">✓ registrada</span>
        <span v-else style="color:#fbbf24" :title="(status.config_missing||[]).length ? 'faltan: '+status.config_missing.join(', ') : 'pendiente'">✗ pendiente</span></div>
      <div class="stline"><span>Sincronización</span>
        <span :style="{color: (status.sync&&status.sync.last_ok)?'#34d399':'#fbbf24'}" :title="(status.sync&&status.sync.last_error)||''">{{ syncLabel }}</span></div>
      <div v-if="ram.total>0">
        <div class="stline mb-1"><span>RAM consumida</span><span :style="{color:ramColor}" class="tabular-nums">{{ ((ram.total-ram.avail)/1024).toFixed(1) }} / {{ (ram.total/1024).toFixed(1) }} GB</span></div>
        <div class="h-1.5 bg-gray-700 rounded-full overflow-hidden"><div class="h-full rounded-full" :style="{width:ramPct+'%', background:ramColor}"></div></div>
      </div>
      <div v-if="appVersion" class="text-xs text-gray-600">build {{ appVersion }}</div>
    </div>
  </div>

  <!-- Main -->
  <div class="flex-1 overflow-y-auto p-6">
    <div v-if="err" class="card border-red-700 bg-red-900/40 text-red-200 px-4 py-2.5 mb-4 text-sm">⚠️ {{ err }}</div>

    <!-- Reabrir el alta cuando se cerró la ventana y aún no está operativa -->
    <div v-if="!onboarding.operativa && altaCerrada" class="card border-amber-700 bg-amber-900/20 text-amber-200 px-4 py-2.5 mb-4 text-sm flex items-center gap-3">
      <span>Alta en ODM pendiente. Puedes seguir consultando el panel mientras tanto.</span>
      <button class="btn btn-primary ml-auto" @click="altaCerrada=false">Reabrir alta</button>
    </div>

    <!-- #10 Gate de alta: ventana de onboarding (cerrable) -->
    <div v-if="!onboarding.operativa && !altaCerrada" class="fixed inset-0 z-50 bg-black/75 overflow-y-auto p-6">
      <div class="max-w-2xl mx-auto">
        <div class="flex items-start justify-between mb-1">
          <h2 class="text-xl font-bold text-gray-100">Alta en OpenDataManager</h2>
          <button class="text-gray-400 hover:text-gray-200 text-3xl leading-none px-2 -mt-1" title="Cerrar" @click="altaCerrada=true">&times;</button>
        </div>
        <p class="text-sm text-gray-400 mb-5">Esta aplicación necesita el alta en ODM para operar: solicita el alta → ODM la aprueba y emite el token (llega por webhook). Puedes <b>cerrar</b> esta ventana y seguir consultando el panel; el alta seguirá su curso.</p>
      <div class="card p-5 mb-5">
        <div class="flex items-center gap-2 text-sm">
          <span class="pill" :style="onboarding.operativa ? 'background:#064e3b;color:#34d399' : 'background:#78350f;color:#fbbf24'">
            {{ onboarding.operativa ? '✓ aplicación operativa' : (onboarding.tiene_token ? 'token guardado' : 'sin alta') }}
          </span>
          <span v-if="onboarding.app_username" class="text-gray-400">como «{{ onboarding.app_username }}»</span>
          <span v-if="onboarding.token_origen" class="text-gray-600 text-xs ml-auto">token: {{ onboarding.token_origen }}</span>
        </div>
        <p v-if="onboarding.token_error" class="text-xs text-red-300 mt-2">El token guardado no valida: {{ onboarding.token_error }}</p>
      </div>

      <div v-if="!onboarding.operativa" class="card p-5 mb-5">
        <h3 class="text-sm font-semibold text-gray-200 mb-1">1 · Solicitar alta</h3>
        <p class="text-xs text-gray-400 mb-3">Registra la solicitud en ODM. Queda pendiente hasta que un administrador la apruebe. Los campos con <span class="text-red-400">*</span> son obligatorios.</p>
        <div class="grid grid-cols-2 gap-3">
          <label class="text-xs text-gray-400">Nombre <span class="text-red-400">*</span><input v-model="altaForm.nombre" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
          <label class="text-xs text-gray-400">Repositorio GitHub <span class="text-red-400">*</span><input v-model="altaForm.github_url" placeholder="https://github.com/…" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
          <label class="text-xs text-gray-400">Persona de contacto <span class="text-red-400">*</span><input v-model="altaForm.persona_contacto" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
          <label class="text-xs text-gray-400">Email <span class="text-red-400">*</span><input v-model="altaForm.email" type="email" placeholder="email@dominio" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
          <label class="text-xs text-gray-400">Teléfono<input v-model="altaForm.telefono" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
          <label class="text-xs text-gray-400">Propósito<input v-model="altaForm.proposito" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
        </div>
        <label class="block text-xs text-gray-400 mt-3">Descripción de la aplicación <span class="text-red-400">*</span>
          <textarea v-model="altaForm.descripcion" rows="6" placeholder="Describe con detalle qué hace la aplicación, qué datos consume de ODM y para qué los utiliza…" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-200 leading-relaxed resize-y min-h-[8rem]"></textarea>
        </label>
        <div class="mt-3 flex items-center gap-3">
          <button class="btn btn-primary" :disabled="busy || !altaCompleta || solicitudPendiente" @click="enviarSolicitud">Enviar solicitud</button>
          <span v-if="!altaCompleta" class="text-xs text-amber-400">Rellena los campos obligatorios (*) para poder enviar.</span>
        </div>
        <div v-if="onboarding.solicitud" class="card px-4 py-2.5 text-sm mt-3"
             :class="onboarding.solicitud.estado==='rechazada' ? 'border-red-700 bg-red-900/30 text-red-200' : 'border-blue-700 bg-blue-900/30 text-blue-200'">
          Solicitud «{{ onboarding.solicitud.nombre }}» —
          <b>{{ onboarding.solicitud.estado==='rechazada' ? 'rechazada' : (onboarding.solicitud.estado==='aprobada' ? 'aprobada' : 'Esperando aprobación') }}</b>.
          <span v-if="solicitudPendiente"> El aviso llega por webhook en cuanto ODM la resuelva (no hace falta preguntar).</span>
          <span v-if="onboarding.solicitud.estado==='rechazada' && onboarding.solicitud.motivo"> Motivo: {{ onboarding.solicitud.motivo }}. Corrige y vuelve a enviar.</span>
        </div>
      </div>

      <div v-if="!onboarding.operativa" class="card p-5 mb-5">
        <h3 class="text-sm font-semibold text-gray-200 mb-1">2 · Introducir el token</h3>
        <p class="text-xs text-gray-400 mb-3">Cuando ODM apruebe el alta te dará un token (se muestra una sola vez). Pégalo aquí.</p>
        <div class="flex gap-2">
          <input v-model="tokenInput" placeholder="odm_..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-200">
          <button class="btn btn-primary whitespace-nowrap" :disabled="busy || !tokenInput" @click="guardarToken">Guardar token</button>
        </div>
        <p class="text-xs text-gray-500 mt-2">Para que sobreviva a redespliegues, muévelo luego al secreto <code>ODM_TOKEN</code>.</p>
      </div>

      </div>
    </div>

    <!-- Recursos -->
    <div v-if="view==='recursos'">
      <div class="flex items-center justify-between mb-1">
        <h2 class="text-xl font-bold text-gray-100">Recursos</h2>
        <button class="btn btn-primary" @click="showWizard = !showWizard">{{ showWizard ? 'Cerrar asistente' : '+ Nuevo recurso' }}</button>
      </div>
      <p class="text-sm text-gray-400 mb-5">Orígenes de datos de los que se abastece CKAN-Jerez.</p>

      <div v-if="onboarding.eventos && onboarding.eventos.length" class="card p-5 mb-5">
        <h3 class="text-sm font-semibold text-gray-200 mb-2">Avisos de ODM</h3>
        <div v-for="(e,i) in onboarding.eventos" :key="i" class="text-sm mb-1"
             :class="e.estadoAprobacion==='rechazado' ? 'text-red-300' : 'text-gray-300'">
          <b>{{ e.name || e.resourceId }}</b> — {{ e.estadoAprobacion }}<span v-if="e.motivoRechazo"> · motivo: {{ e.motivoRechazo }}</span>
        </div>
      </div>


      <div class="card p-5 mb-6">
        <div class="flex flex-wrap items-center gap-3 mb-4">
          <input v-model="filtros.q" placeholder="Buscar por nombre o publisher…" class="flex-1 min-w-64 bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-200">
          <select v-model="filtros.pub" class="bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200">
            <option value="">Publisher: todos</option>
            <option v-for="p in pubsDisponibles" :key="p" :value="p">{{ p }}</option>
          </select>
          <label class="text-xs text-gray-400 flex items-center gap-1.5"><input type="checkbox" v-model="filtros.soloSus"> solo suscritos</label>
          <span class="text-xs text-gray-500 ml-auto">{{ recursosFiltrados.length }} / {{ resources.length }}</span>
        </div>
        <table class="w-full"><thead><tr><th>Nombre</th><th>Publisher</th><th>Suscripción</th><th>Última ejecución OK</th><th class="text-right">Acciones</th></tr></thead>
          <tbody>
            <tr v-for="s in pendientes" :key="'p-'+s.name">
              <td class="text-gray-400">{{ s.name }}</td>
              <td class="text-gray-500">{{ (catalog.publishers[s.publisher]||{}).nombre || s.publisher }}</td>
              <td colspan="2"><span class="pill" style="background:#78350f;color:#fbbf24">pendiente de crear en ODM</span></td>
              <td></td>
            </tr>
            <template v-for="r in topNivel" :key="r.id">
            <tr>
              <td class="text-gray-200" :title="r.id">
                <button v-if="esNodriza(r) && hijosDe(r.id).length" @click="toggleNodriza(r.id)" style="border:0;background:none;cursor:pointer;color:#c4b5fd" :title="(expandidas.has(r.id)?'Contraer':'Desplegar')+' recursos descubiertos'">{{ expandidas.has(r.id) ? '▾' : '▸' }}</button>
                <span v-if="esNodriza(r)" title="Nave nodriza (descubre recursos)">🛰️</span>
                <span v-else title="Recurso (hoja)">📄</span>
                {{ r.name }}
                <span v-if="esNodriza(r) && hijosDe(r.id).length" class="text-gray-500" style="font-size:.7rem">({{ hijosDe(r.id).length }} descubiertos)</span>
              </td>
              <td class="text-gray-400">{{ r.publisher || '—' }}</td>
              <td>
                <button v-if="subByResource[r.id]" class="pill" style="background:#064e3b;color:#34d399;border:0;cursor:pointer" :disabled="busy" @click="desuscribir(r.id)" title="Pulsar para desuscribir">✓ suscrito</button>
                <button v-else class="pill bg-gray-700 text-gray-300" style="border:0;cursor:pointer" :disabled="busy || !status.application" @click="suscribir(r.id)" :title="status.application ? 'Pulsar para suscribir' : 'Requiere Application registrada'">suscribir</button>
              </td>
              <td :style="{color: (lastOk[r.id] && (Date.now()-new Date(lastOk[r.id]+'Z').getTime())<3600000) ? '#34d399' : '#6b7280'}">{{ fmtAgo(lastOk[r.id]) }}</td>
              <td class="text-right whitespace-nowrap">
                <div style="display:inline-flex;align-items:center;gap:.125rem">
                  <button :disabled="busy" @click="refrescar(r.id)" title="Refrescar" style="padding:.3rem;border-radius:.375rem;border:0;background:none;cursor:pointer;color:#9ca3af" class="hover:bg-gray-700"><svg style="width:1rem;height:1rem" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg></button>
                  <button :disabled="busy" @click="clonar(r.id)" title="Clonar" style="padding:.3rem;border-radius:.375rem;border:0;background:none;cursor:pointer;color:#9ca3af" class="hover:bg-gray-700"><svg style="width:1rem;height:1rem" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg></button>
                  <button :disabled="busy" @click="borrarRecurso(r.id, r.name)" title="Borrar" style="padding:.3rem;border-radius:.375rem;border:0;background:none;cursor:pointer;color:#6b7280" onmouseover="this.style.color='#f87171'" onmouseout="this.style.color='#6b7280'"><svg style="width:1rem;height:1rem" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                </div>
              </td>
            </tr>
            <tr v-for="c in (expandidas.has(r.id) ? hijosDe(r.id) : [])" :key="c.id" style="background:rgba(0,0,0,.25)">
              <td class="text-gray-300" :title="c.id"><span class="text-gray-600" style="padding-left:1.25rem">└─</span> {{ c.name }} <span class="pill" style="background:#3b0764;color:#c4b5fd;font-size:.62rem">descubierto</span></td>
              <td class="text-gray-500">{{ c.publisher || '—' }}</td>
              <td>
                <button v-if="subByResource[c.id]" class="pill" style="background:#064e3b;color:#34d399;border:0;cursor:pointer" :disabled="busy" @click="desuscribir(c.id)" title="Pulsar para desuscribir">✓ suscrito</button>
                <button v-else class="pill bg-gray-700 text-gray-300" style="border:0;cursor:pointer" :disabled="busy || !status.application" @click="suscribir(c.id)" :title="status.application ? 'Pulsar para suscribir' : 'Requiere Application registrada'">suscribir</button>
              </td>
              <td :style="{color: (lastOk[c.id] && (Date.now()-new Date(lastOk[c.id]+'Z').getTime())<3600000) ? '#34d399' : '#6b7280'}">{{ fmtAgo(lastOk[c.id]) }}</td>
              <td class="text-right whitespace-nowrap">
                <div style="display:inline-flex;align-items:center;gap:.125rem">
                  <button :disabled="busy" @click="refrescar(c.id)" title="Refrescar" style="padding:.3rem;border-radius:.375rem;border:0;background:none;cursor:pointer;color:#9ca3af" class="hover:bg-gray-700"><svg style="width:1rem;height:1rem" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg></button>
                  <button :disabled="busy" @click="borrarRecurso(c.id, c.name)" title="Borrar" style="padding:.3rem;border-radius:.375rem;border:0;background:none;cursor:pointer;color:#6b7280" onmouseover="this.style.color='#f87171'" onmouseout="this.style.color='#6b7280'"><svg style="width:1rem;height:1rem" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                </div>
              </td>
            </tr>
            </template>
            <tr v-if="!topNivel.length && !pendientes.length"><td colspan="5" class="text-gray-500">Sin recursos con ese filtro.</td></tr>
          </tbody></table>
      </div>

      <div v-if="onboarding.operativa" class="card p-5">
        <h3 class="text-sm font-semibold text-gray-200 mb-1">Proponer un recurso al catálogo</h3>
        <p class="text-xs text-gray-400 mb-3">Propones una fuente Web Tree. ODM la registra como <b>pendiente</b>; un administrador la aprueba antes de que se ejecute.</p>
        <div class="grid grid-cols-2 gap-3">
          <label class="text-xs text-gray-400">Nombre<input v-model="proposeForm.name" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
          <label class="text-xs text-gray-400">URL raíz<input v-model="proposeForm.root_url" placeholder="https://…" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
          <label class="text-xs text-gray-400">¿Qué obtener de cada documento?
            <select v-model="proposeForm.variante" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200">
              <option value="Censo documental">Solo listar los documentos (no descarga)</option>
              <option value="Extracción de datos">Extraer los datos de sus tablas</option>
              <option value="Extracción con receta">Extraer campos concretos (receta)</option></select>
            <span class="block text-[11px] text-gray-500 mt-0.5">Si no estás seguro, deja «solo listar».</span></label>
          <label class="text-xs text-gray-400">Descripción<input v-model="proposeForm.descripcion" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
        </div>
        <div class="mt-3"><button class="btn btn-primary" :disabled="busy || !proposeForm.name || !proposeForm.root_url" @click="proponerRecurso">Proponer recurso</button></div>
        <div v-if="proposeDone" class="card border-green-700 bg-green-900/30 text-green-200 px-4 py-2.5 text-sm mt-3">
          ✅ Propuesto «{{ proposeDone.name }}» — pendiente de aprobación en ODM.
        </div>
      </div>

      <!-- Asistente (a demanda) -->
      <div v-if="showWizard" class="card p-5">
        <h3 class="text-sm font-semibold text-gray-200 mb-3">Nuevo recurso</h3>
        <div class="flex flex-wrap items-end gap-3">
          <label class="text-xs text-gray-400">Fetcher
            <select v-model="wizard.fetcher" @change="wizard.preset=''" class="block mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200">
              <option value="">—</option><option v-for="f in fetchers" :key="f.id" :value="f.name">{{ f.name }}</option></select></label>
          <label class="text-xs text-gray-400">Variante
            <select v-model="wizard.preset" class="block mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200">
              <option value="">(ninguna)</option><option v-for="p in presetsOf" :key="p.id" :value="p.code">{{ p.code }}</option></select></label>
          <button class="btn btn-ghost" :disabled="busy || !wizard.fetcher" @click="getTemplate">Empezar</button>
        </div>

        <div v-if="wizard.template" class="mt-4 space-y-4">
          <div v-if="wizard.fixed.length" class="text-xs text-gray-400">
            Fijado por la variante: <span v-for="f in wizard.fixed" :key="f" class="pill bg-gray-700 text-gray-300 ml-1">🔒 {{ f }}</span>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <label class="text-xs text-gray-400">Publisher
              <select v-model="wizard.form.pub" @change="pickPub" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200">
                <option value="">— nuevo —</option>
                <optgroup label="Del catálogo">
                  <option v-for="(v,k) in catalog.publishers" :key="k" :value="k">{{ v.nombre || k }}</option>
                </optgroup>
                <optgroup label="Ya en ODM" v-if="pubsOdmExtra.length">
                  <option v-for="p in pubsOdmExtra" :key="p.id" :value="'odm:'+p.id">{{ p.nombre }}</option>
                </optgroup>
              </select></label>
            <label class="text-xs text-gray-400">Nombre del recurso
              <input v-model="wizard.form.name" placeholder="Jerez — …" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
          </div>
          <div v-if="!wizard.form.pub" class="grid grid-cols-4 gap-3">
            <label class="text-xs text-gray-400">Acrónimo
              <input v-model="wizard.form.publisher.acronimo" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
            <label class="text-xs text-gray-400">Nombre
              <input v-model="wizard.form.publisher.nombre" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
            <label class="text-xs text-gray-400">Nivel
              <select v-model="wizard.form.publisher.nivel" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200">
                <option>MUNICIPAL</option><option>PROVINCIAL</option><option>AUTONOMICO</option><option>ESTATAL</option></select></label>
            <label class="text-xs text-gray-400">Portal
              <input v-model="wizard.form.publisher.portal_url" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
          </div>
          <div>
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs text-gray-400">Parámetros (los de la variante vienen precargados)</span>
              <button class="btn btn-ghost" @click="addParam">+ parámetro</button>
            </div>
            <div v-for="(p,i) in wizard.form.params" :key="i" class="flex gap-2 mb-1.5">
              <input v-model="p.key" placeholder="clave" class="w-56 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200">
              <input v-model="p.value" placeholder="valor" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200">
              <button class="btn btn-ghost" @click="delParam(i)">✕</button>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <label class="text-xs text-gray-400">Schedule (cron, opcional)
              <input v-model="wizard.form.schedule" placeholder="0 4 1 * *" class="block w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
          </div>
          <div v-if="wizard.form.name && enOdm(wizard.form.name)" class="text-xs" style="color:#fbbf24">
            ⚠️ Ya existe en ODM un recurso con ese nombre: al crear se ACTUALIZARÁ (no se duplica).
          </div>
          <div class="flex gap-2">
            <button class="btn btn-primary" :disabled="busy || !wizard.form.name" @click="createSource">Crear en ODM</button>
            <button class="btn btn-ghost" :disabled="busy" @click="previewSource">Previsualizar manifiesto</button>
          </div>
          <div v-if="wizard.done" class="card border-green-700 bg-green-900/30 text-green-200 px-4 py-2.5 text-sm">✅ {{ JSON.stringify(wizard.done) }}</div>
          <details v-if="wizard.manifest"><summary class="text-xs text-gray-500 cursor-pointer">manifiesto generado</summary>
            <pre class="mt-2">{{ JSON.stringify(wizard.manifest, null, 2) }}</pre></details>
        </div>
      </div>
    </div>

    <!-- Actividad -->
    <div v-else-if="view==='actividad'">
      <h2 class="text-xl font-bold text-gray-100 mb-1">Recepciones</h2>
      <p class="text-sm text-gray-400 mb-5">Entregas que ODM ha enviado por webhook a CKAN-Jerez con datos nuevos.</p>
      <div class="card p-5 mb-6">
        <div class="flex flex-wrap items-end gap-3 mb-4">
          <label class="text-xs text-gray-400">Desde<input type="date" v-model="filtrosRec.desde" class="block mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
          <label class="text-xs text-gray-400">Hasta<input type="date" v-model="filtrosRec.hasta" class="block mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
          <label class="text-xs text-gray-400">Dataset<input v-model="filtrosRec.dataset" placeholder="nombre/id…" class="block mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"></label>
          <label class="text-xs text-gray-400">Publicador<select v-model="filtrosRec.pub" class="block mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"><option value="">todos</option><option v-for="p in publishersRec" :key="p" :value="p">{{ p }}</option></select></label>
          <label class="text-xs text-gray-400">Estado<select v-model="filtrosRec.estado" class="block mt-1 bg-gray-900 border border-gray-700 rounded-lg px-2 py-1.5 text-sm text-gray-200"><option value="">todos</option><option value="ok">OK (2xx)</option><option value="error">error</option></select></label>
          <button class="btn btn-ghost" @click="filtrosRec.desde='';filtrosRec.hasta='';filtrosRec.dataset='';filtrosRec.estado='';filtrosRec.pub=''">Limpiar</button>
          <span class="text-xs text-gray-500 ml-auto">{{ recepcionesFiltradas.length }} / {{ notifications.length }}</span>
        </div>
        <table class="w-full"><thead><tr><th>Enviado</th><th>Publicador</th><th>Dataset</th><th>HTTP</th><th>Error</th></tr></thead>
          <tbody><tr v-for="n in recepcionesFiltradas" :key="n.id">
            <td class="text-gray-500">{{ fmtAgo(n.sentAt) }}</td><td class="text-gray-400">{{ n.publisher || '—' }}</td><td :title="n.datasetId">{{ n.datasetName || n.datasetId || '—' }}</td>
            <td><span class="pill" :style="{background: n.statusCode>=200&&n.statusCode<300?'#064e3b':'#7f1d1d', color: n.statusCode>=200&&n.statusCode<300?'#34d399':'#f87171'}">{{ n.statusCode || '—' }}</span></td>
            <td class="text-red-300">{{ n.errorMessage || '' }}</td>
          </tr><tr v-if="!recepcionesFiltradas.length"><td colspan="5" class="text-gray-500">Sin recepciones con ese filtro.</td></tr></tbody></table>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div v-if="modal.open" class="fixed inset-0 z-50 flex items-center justify-center" style="background:rgba(0,0,0,.6)" @click.self="modal.open=false">
    <div class="card p-5 w-full max-w-md mx-4">
      <h3 class="text-sm font-semibold text-yellow-400 mb-2">⚠️ {{ modal.titulo }}</h3>
      <p class="text-sm text-gray-300">{{ modal.texto }}</p>
      <div class="mt-4 text-right"><button class="btn btn-primary" @click="modal.open=false">Entendido</button></div>
    </div>
  </div>


  <!-- #18 Modal de borrado con hard-delete -->
  <div v-if="delRecurso.open" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60" @click.self="delRecurso.open=false">
    <div class="bg-gray-800 border border-red-700/50 rounded-xl p-6 w-[440px] shadow-2xl">
      <h3 class="text-base font-semibold text-white mb-2">Borrar recurso</h3>
      <p class="text-sm text-gray-300 mb-3">Se borrará en ODM el recurso «{{ delRecurso.nombre }}». Por defecto va a la papelera (recuperable).</p>
      <label class="flex items-start gap-2 mb-4 cursor-pointer">
        <input type="checkbox" v-model="delRecurso.hard" class="mt-0.5 accent-red-500">
        <span class="text-sm text-red-300">Eliminar permanentemente <span class="block text-xs text-gray-500">Sin marcar → papelera. Marcado → borrado irreversible (BD + disco).</span></span>
      </label>
      <div class="flex justify-end gap-2">
        <button class="btn btn-ghost" @click="delRecurso.open=false">Cancelar</button>
        <button class="btn" :class="delRecurso.hard ? 'btn-danger' : 'btn-primary'" :disabled="busy" @click="confirmarBorrado">{{ delRecurso.hard ? 'Eliminar permanentemente' : 'Mover a papelera' }}</button>
      </div>
    </div>
  </div>

  <!-- Ayuda -->
  <div v-if="help" class="fixed inset-0 z-50 flex items-center justify-center" style="background:rgba(0,0,0,.6)" @click.self="help=false">
    <div class="card p-6 w-full max-w-2xl mx-4" style="max-height:85vh;overflow-y:auto">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-base font-semibold text-blue-300">❓ Ayuda · cómo funciona ckan-jerez</h3>
        <button class="text-gray-400 hover:text-white" @click="help=false">✕</button>
      </div>
      <div class="text-sm text-gray-300 space-y-3 leading-relaxed">
        <p><b>ckan-jerez</b> es un <b>consumidor</b> de OpenDataManager (ODM): no produce datos, los recibe de ODM y los publica de forma homogénea en CKAN.</p>
        <p class="text-gray-200 font-medium">Ciclo de vida (diálogo de alta inicial)</p>
        <ol class="list-decimal ml-5 space-y-1">
          <li><b>Solicitar alta</b>: envías una solicitud a ODM; queda <i>pendiente</i>.</li>
          <li><b>Aprobación</b>: un administrador de ODM la aprueba y emite un <b>token</b> (visible una sola vez).</li>
          <li><b>Token</b>: lo pegas aquí; desde entonces ckan-jerez actúa como aplicación identificada.</li>
          <li><b>Suscripción</b>: en «Recursos» te suscribes a los que te interesen; ODM avisa por webhook al haber datos nuevos.</li>
          <li><b>Propuesta</b>: puedes <b>proponer</b> recursos nuevos; ODM los crea <i>pendientes</i> y un administrador los aprueba antes de ejecutarlos.</li>
        </ol>
        <p class="text-gray-200 font-medium">Productor vs. consumidor</p>
        <p>El rastreo de un portal (recurso «nodriza» Web Tree) afecta al sitio de origen, por eso <b>se propone desde aquí pero lo aprueba e instancia ODM</b>. Las suscripciones y la publicación en CKAN son responsabilidad de ckan-jerez.</p>
      </div>
      <div class="mt-4 text-right"><button class="btn btn-primary" @click="help=false">Entendido</button></div>
    </div>
  </div>
  `
}).mount('#app')
</script>
</body>
</html>
