<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ckan-jerez — Consola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { mono: ['JetBrains Mono','Monaco','monospace'] } } } }</script>
  <style>
    body { background:#111827; color:#d1d5db; }
    .nav-item { display:flex; align-items:center; gap:.625rem; padding:.625rem .75rem; border-radius:.5rem; font-size:.875rem; color:#d1d5db; cursor:pointer; transition:background .15s,color .15s; }
    .nav-item:hover { background:#374151; color:#fff; }
    .nav-item.active { background:#374151; color:#fff; font-weight:500; }
    .card { background:#1f2937; border:1px solid #374151; border-radius:.75rem; }
    .btn { font-size:.8rem; border-radius:.5rem; padding:.45rem .85rem; transition:background .15s; }
    .btn-primary { background:#2563eb; color:#fff; } .btn-primary:hover { background:#3b82f6; }
    .btn-ghost { background:rgba(55,65,81,.5); color:#cbd5e1; } .btn-ghost:hover { background:#374151; color:#fff; }
    th { text-align:left; font-weight:600; color:#9ca3af; }
    td,th { padding:.5rem .65rem; border-bottom:1px solid #374151; font-size:.8rem; vertical-align:top; }
    pre { background:#0b1220; border:1px solid #374151; border-radius:.5rem; padding:.75rem; overflow:auto; font-size:.75rem; color:#cbd5e1; }
    .pill { font-size:.7rem; padding:.1rem .5rem; border-radius:9999px; font-weight:500; white-space:nowrap; }
    .stline { display:flex; align-items:center; justify-content:space-between; font-size:.72rem; color:#6b7280; }
    input, select { outline:none; }
  </style>
</head>
<body class="font-mono">
<div id="app" class="flex h-screen overflow-hidden"></div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
const { createApp, ref, reactive, onMounted, computed } = Vue

createApp({
  setup() {
    const view = ref('suscripciones')
    const nav = [
      { id:'suscripciones', label:'🛰️ Suscripciones' },
      { id:'recepciones',   label:'📨 Recepciones' },
    ]
    const help = ref(false)
    const err  = ref('')
    const appVersion = ref('')
    const ram = reactive({ total:0, avail:0 })
    const status = reactive({ ckan_configured:false, config_missing:[], operativa:false, webhook_url:null, subscriptions_count:0 })
    const subs = ref([])
    const events = ref([])
    const q = ref('')

    // ── infra ──
    async function api(path) {
      const r = await fetch('/api'+path)
      if (!r.ok) { let d; try{ d=await r.json() }catch{}; throw new Error(d?.detail || (r.status+' '+r.statusText)) }
      return r.json()
    }
    async function load() {
      try { Object.assign(status, await api('/status')) } catch (e) { err.value=String(e.message||e) }
      try { subs.value   = await api('/odm/subscriptions') } catch {}
      try { events.value = await api('/odm/notifications') } catch {}
      try { const v = await api('/version'); appVersion.value = v.version } catch {}
      try { const d = await api('/system/info'); ram.total=d.ram_total_mb; ram.avail=d.ram_available_mb } catch {}
    }
    const go = (v) => { view.value=v; help.value=false }

    // ── derivados / formato ──
    const ramPct   = computed(() => ram.total ? Math.round((1 - ram.avail/ram.total)*100) : 0)
    const ramColor = computed(() => ramPct.value>85 ? '#f87171' : ramPct.value>60 ? '#fbbf24' : '#34d399')
    const fmt   = (ts) => { if (!ts) return '—'; const d=new Date(ts); return isNaN(d)? String(ts) : d.toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) }
    const fday  = (ts) => { if (!ts) return '—'; const d=new Date(ts); return isNaN(d)? String(ts) : d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}) }
    const isAuto = (v) => v===true || v==='true' || v==='1' || v===1

    const subsFiltradas = computed(() => {
      const t = q.value.trim().toLowerCase()
      const arr = subs.value || []
      if (!t) return arr
      return arr.filter(s => ((s.resourceName||s.resourceId||'')+' '+(s.publisher||'')).toLowerCase().includes(t))
    })

    const EVT = {
      suscripcion_activada:    { icon:'➕', label:'Suscripción activada', cls:'bg-emerald-900/40 text-emerald-300' },
      suscripcion_desactivada: { icon:'➖', label:'Suscripción retirada',  cls:'bg-gray-700 text-gray-300' },
      anulada:                 { icon:'⛔', label:'Registro anulado',       cls:'bg-red-900/40 text-red-300' },
      publicado:               { icon:'✅', label:'Publicado en CKAN',      cls:'bg-blue-900/40 text-blue-300' },
    }
    const evtMeta = (k) => EVT[k] || { icon:'•', label:k||'evento', cls:'bg-gray-700 text-gray-300' }
    const evtDetalle = (e) => {
      if (e.kind==='suscripcion_activada') return (e.resourceName||e.resourceId||'') + (e.publisher? ' · '+e.publisher : '')
      if (e.kind==='suscripcion_desactivada') return e.resourceId || '—'
      if (e.kind==='publicado') return (e.package||'') + (e.result? ' ('+e.result+')' : '') + (e.datasetId? ' · ds '+e.datasetId : '')
      return '—'
    }

    onMounted(() => { load(); setInterval(load, 5000) })

    return { view, nav, help, err, appVersion, ram, ramPct, ramColor, status,
             subs, events, q, subsFiltradas, fmt, fday, isAuto, evtMeta, evtDetalle, go }
  },
  template: `
  <!-- Sidebar -->
  <div class="w-64 h-full bg-gray-800 border-r border-gray-700 flex flex-col flex-shrink-0">
    <div class="p-5 border-b border-gray-700">
      <h1 class="text-lg font-bold text-blue-400 leading-tight">ckan-jerez</h1>
      <p class="text-xs text-gray-400 mt-0.5">Suscriptor de OpenDataManager</p>
    </div>
    <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto">
      <div v-for="n in nav" :key="n.id" class="nav-item" :class="{active: view===n.id && !help}" @click="go(n.id)">{{ n.label }}</div>
      <div class="nav-item" :class="{active: help}" @click="help=true">❓ Ayuda</div>
    </nav>
    <div class="p-4 border-t border-gray-700 space-y-2">
      <div class="stline"><span>Recepción</span>
        <span v-if="status.operativa" style="color:#34d399" :title="'webhook: '+(status.webhook_url||'—')">✓ operativa</span>
        <span v-else style="color:#fbbf24" :title="(status.config_missing||[]).length ? 'falta: '+status.config_missing.join(', ') : 'pendiente'">✗ falta config</span></div>
      <div class="stline"><span>CKAN</span>
        <span :style="{color: status.ckan_configured?'#34d399':'#6b7280'}">{{ status.ckan_configured ? 'configurado' : 'sin configurar' }}</span></div>
      <div class="stline"><span>Suscripciones</span>
        <span class="tabular-nums" style="color:#9ca3af">{{ status.subscriptions_count }}</span></div>
      <div v-if="ram.total>0">
        <div class="stline mb-1"><span>RAM consumida</span><span :style="{color:ramColor}" class="tabular-nums">{{ ((ram.total-ram.avail)/1024).toFixed(1) }} / {{ (ram.total/1024).toFixed(1) }} GB</span></div>
        <div class="h-1.5 bg-gray-700 rounded-full overflow-hidden"><div class="h-full rounded-full" :style="{width:ramPct+'%', background:ramColor}"></div></div>
      </div>
      <div v-if="appVersion" class="text-xs text-gray-600">build {{ appVersion }}</div>
    </div>
  </div>

  <!-- Main -->
  <div class="flex-1 overflow-y-auto p-6">
    <div v-if="err" class="card border-red-700 bg-red-900/40 text-red-200 px-4 py-2.5 mb-4 text-sm">⚠️ {{ err }}</div>

    <div v-if="!status.operativa" class="card border-amber-700 bg-amber-900/20 text-amber-200 px-4 py-3 mb-4 text-sm">
      <div class="flex items-start gap-3">
        <span class="text-lg leading-none">⏳</span>
        <div class="flex-1">
          <p>Esta aplicación aún no está operativa para recibir datos.</p>
          <p v-if="(status.config_missing||[]).length" class="mt-1 text-amber-300/90">Falta configurar: <span class="font-semibold">{{ status.config_missing.join(', ') }}</span>.</p>
          <p class="mt-1 text-amber-300/80">La configuración la pone el operador (el secreto compartido del webhook y la URL pública). No hay token ni alta que solicitar desde aquí.</p>
        </div>
      </div>
    </div>

    <!-- Ayuda -->
    <div v-if="help">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-white">Ayuda</h2>
        <button class="btn btn-ghost" @click="help=false">✕ cerrar</button>
      </div>
      <div class="card p-5 mb-4 text-sm leading-relaxed space-y-2">
        <h3 class="text-white font-semibold">Puesta en marcha</h3>
        <ol class="list-decimal ml-5 space-y-1 text-gray-300">
          <li>El operador da de alta este suscriptor en ODM, apuntando a su webhook y con un secreto compartido.</li>
          <li>Ese mismo secreto se configura aquí (<code class="text-gray-200">ODM_WEBHOOK_SECRET</code>) junto con la URL pública. No interviene ningún token.</li>
          <li>El operador gobierna las suscripciones desde ODM: decide a qué recursos queda suscrito ckan-jerez.</li>
          <li>ODM empuja por webhook tanto los datos como las altas y bajas de suscripción; ckan-jerez los publica en CKAN.</li>
        </ol>
      </div>
      <div class="card p-5 text-sm leading-relaxed space-y-2">
        <h3 class="text-white font-semibold">Productor y consumidor</h3>
        <p class="text-gray-300">ODM es un <span class="text-gray-100">productor neutral</span>: expone datos sin conocer su destino. ckan-jerez es un <span class="text-gray-100">consumidor homogeneizador</span>: cualquier dataset de ODM se proyecta de forma uniforme a un package CKAN (DCAT).</p>
        <p class="text-gray-400">El canal es push puro y firmado por HMAC. ckan-jerez no llama a ODM: solo recibe, verifica la firma y publica.</p>
      </div>
    </div>

    <!-- Suscripciones -->
    <div v-else-if="view==='suscripciones'">
      <div class="flex items-center justify-between mb-4 gap-3">
        <h2 class="text-xl font-bold text-white">Suscripciones</h2>
        <input v-model="q" placeholder="filtrar recurso u organismo…" class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm w-64" />
      </div>
      <div class="card overflow-hidden">
        <table class="w-full" v-if="subsFiltradas.length">
          <thead><tr><th>Recurso</th><th>Organismo</th><th>Versión</th><th>Desde</th></tr></thead>
          <tbody>
            <tr v-for="s in subsFiltradas" :key="s.subscriptionId || s.resourceId">
              <td class="text-gray-100">{{ s.resourceName || s.resourceId }}</td>
              <td class="text-gray-400">{{ s.publisher || '—' }}</td>
              <td>
                <span class="text-gray-300">{{ s.pinnedVersion ? 'fijada '+s.pinnedVersion : 'última' }}</span>
                <span v-if="isAuto(s.autoUpgrade)" class="pill bg-blue-900/40 text-blue-300 ml-2">auto</span>
              </td>
              <td class="text-gray-500 tabular-nums">{{ fday(s.since) }}</td>
            </tr>
          </tbody>
        </table>
        <div v-else class="p-8 text-center text-sm text-gray-500">
          <p v-if="status.operativa">Operativa y a la espera. El operador aún no te ha suscrito a ningún recurso en ODM.</p>
          <p v-else>Sin suscripciones. Aparecerán aquí en cuanto el operador asigne recursos desde ODM.</p>
        </div>
      </div>
    </div>

    <!-- Recepciones -->
    <div v-else-if="view==='recepciones'">
      <h2 class="text-xl font-bold text-white mb-4">Recepciones</h2>
      <p class="text-xs text-gray-500 mb-3">Bitácora de lo que ODM ha empujado a este suscriptor (en memoria; se reinicia con el servicio).</p>
      <div class="card overflow-hidden">
        <table class="w-full" v-if="events.length">
          <thead><tr><th>Cuándo</th><th>Evento</th><th>Detalle</th></tr></thead>
          <tbody>
            <tr v-for="(e,i) in events" :key="i">
              <td class="text-gray-500 tabular-nums whitespace-nowrap">{{ fmt(e.ts) }}</td>
              <td><span class="pill" :class="evtMeta(e.kind).cls">{{ evtMeta(e.kind).icon }} {{ evtMeta(e.kind).label }}</span></td>
              <td class="text-gray-300">{{ evtDetalle(e) }}</td>
            </tr>
          </tbody>
        </table>
        <div v-else class="p-8 text-center text-sm text-gray-500">Sin actividad todavía.</div>
      </div>
    </div>
  </div>
  `,
}).mount('#app')
</script>
</body>
</html>
